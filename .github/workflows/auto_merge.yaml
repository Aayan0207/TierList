name: Auto-Merge

on:
    pull_request:
        types: [opened, synchronize]

jobs:
    automerge:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - name: Enabling auto-merge
              uses: peter-evans/enable-pull-request-automerge@v3
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  merge-method: squash
